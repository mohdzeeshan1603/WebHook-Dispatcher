spring.application.name=webhook-dispatcher
server.port=${PORT:8080}
# spring.data.mongodb.uri=mongodb://localhost:27017/webhook_db
# spring.data.mongodb.auto-index-creation=true

# Webhook Background Worker Settings
webhook.worker.poll-interval-ms=500
webhook.worker.max-retries=3
webhook.worker.response-timeout-seconds=3

# Per-Domain Rate Limiter Settings
webhook.rate-limit.max-requests-per-window=5
webhook.rate-limit.window-seconds=10
